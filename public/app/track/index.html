<!DOCTYPE html>
<html lang="en-NG" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Primary SEO -->
    <title>Live Dispatch Rider & Parcel Tracking | Pickars Port Harcourt</title>
    <meta
      name="description"
      content="Track your Pickars dispatch rider in real-time. Enter your tracking ID for live GPS updates, estimated pickup times, and package status in Port Harcourt."
    />
    <meta
      name="keywords"
      content="Pickars tracking, track dispatch rider Port Harcourt, live delivery tracking PH, parcel status Nigeria, bike courier tracking Port Harcourt, Pickars order tracking"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Pickars Courier Limited" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.pickars.com/track" />
    <link
      rel="alternate"
      hreflang="en-NG"
      href="https://www.pickars.com/track"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://www.pickars.com/track"
    />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="NG-RI" />
    <meta name="geo.placename" content="Port Harcourt" />
    <meta name="geo.position" content="4.824167;7.080833" />
    <meta name="ICBM" content="4.824167, 7.080833" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pickars.com/track" />
    <meta property="og:site_name" content="Pickars Logistics" />
    <meta property="og:locale" content="en_NG" />
    <meta
      property="og:title"
      content="Live Dispatch Rider & Parcel Tracking | Pickars Logistics"
    />
    <meta
      property="og:description"
      content="Track your package and dispatch rider live in Port Harcourt. Get instant updates on pickup, transit status, and delivery completion."
    />
    <meta property="og:image" content="https://www.pickars.com/track.png" />
    <meta
      property="og:image:secure_url"
      content="https://www.pickars.com/track.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pickars Live Dispatch & Parcel Tracking"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pickars_app" />
    <meta name="twitter:creator" content="@pickars_app" />
    <meta name="twitter:url" content="https://www.pickars.com/track" />
    <meta
      name="twitter:title"
      content="Live Dispatch Rider Tracking | Pickars"
    />
    <meta
      name="twitter:description"
      content="Monitor your rider's live location and parcel status across Port Harcourt in real-time."
    />
    <meta name="twitter:image" content="https://www.pickars.com/track.png" />
    <meta
      name="twitter:image:alt"
      content="Pickars Live Dispatch & Parcel Tracking"
    />

    <!-- Theme & PWA -->
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0F172A"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="PICKARS" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": "https://www.pickars.com/track#webpage",
            "url": "https://www.pickars.com/track",
            "name": "Live Dispatch Rider & Parcel Tracking | Pickars Port Harcourt",
            "description": "Track your dispatch rider and parcel status live across Port Harcourt with Pickars. Enter your tracking ID for real-time GPS updates.",
            "primaryImageOfPage": {
              "@type": "ImageObject",
              "url": "https://www.pickars.com/track.png"
            },
            "isPartOf": {
              "@type": "WebSite",
              "@id": "https://www.pickars.com/#website",
              "url": "https://www.pickars.com/",
              "name": "Pickars"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://www.pickars.com/track?id={tracking_id}",
              "query-input": "required name=tracking_id"
            },
            "inLanguage": "en-NG"
          },
          {
            "@type": "DeliveryService",
            "@id": "https://www.pickars.com/#trackingservice",
            "name": "Pickars Live GPS Parcel Tracking",
            "provider": {
              "@type": "LocalBusiness",
              "name": "Pickars Logistics",
              "telephone": "+2349164860591",
              "address": {
                "@type": "PostalAddress",
                "addressLocality": "Port Harcourt",
                "addressRegion": "Rivers State",
                "addressCountry": "NG"
              }
            },
            "areaServed": {
              "@type": "City",
              "name": "Port Harcourt"
            },
            "description": "Real-time dispatch rider location, parcel status monitoring, and express last-mile package tracking in Port Harcourt."
          }
        ]
      }
    </script>
  </head>
  <body
    class="bg-slate-50 antialiased text-slate-900 selection:bg-amber-400 selection:text-slate-900"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
